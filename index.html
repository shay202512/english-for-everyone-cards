<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English for Everyone · 卡片词典</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">📖 <span>English for Everyone</span> · 卡片词典</div>
  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索单词 / 音标 / 词性…  (按 / 聚焦)" autocomplete="off">
    </div>
    <select id="theme" title="按主题筛选">
      <option value="">全部主题</option>
    </select>
    <span id="counter" class="counter">—</span>
  </div>
</header>

<main id="deck" class="deck"></main>

<div id="empty" class="empty" hidden>没有匹配的卡片</div>

<nav class="pager">
  <button id="drill" title="抽卡模式 (D)">🎴</button>
  <button id="shuffle" title="随机抽一张 (R)">🎲</button>
  <button id="prev" title="上一张 (↑)">↑</button>
  <span id="pos" class="pos">0 / 0</span>
  <button id="next" title="下一张 (↓)">↓</button>
</nav>

<div id="lightbox" class="lightbox" hidden>
  <img id="lightbox-img" src="" alt="放大图">
  <button id="lightbox-close" title="关闭 (Esc)">✕</button>
</div>

<div id="drill-mode" class="drill" hidden>
  <button id="drill-close" class="drill-close" title="退出 (Esc)">✕</button>
  <div class="drill-inner">
    <div class="drill-head">
      <h3 id="drill-title"></h3>
      <span id="drill-page" class="page"></span>
      <span class="dpos" id="drill-pos"></span>
    </div>
    <div class="drill-body">
      <div class="illus"><img id="drill-img" src="" alt=""></div>
      <div class="words" id="drill-words"></div>
    </div>
    <div class="drill-foot">
      <button id="drill-speak" title="朗读本页所有单词">🔊 朗读本页</button>
      <span class="grow"></span>
      <button id="drill-next" class="primary">换一张 🎲</button>
    </div>
  </div>
</div>

<script src="data/pages.js"></script>
<script src="app.js"></script>
</body>
</html>
